name: Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore InsightFlow.Desktop.sln
      - name: Build
        run: dotnet build InsightFlow.Desktop.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test InsightFlow.Desktop.sln --configuration Release --no-build --no-restore
