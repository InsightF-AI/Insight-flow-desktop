name: Desktop

on:
  # Branches de trabalho são validadas pelo pull request; o push direto só roda nas branches de integração.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore InsightFlow.Desktop.sln
      - name: Build
        run: dotnet build InsightFlow.Desktop.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test InsightFlow.Desktop.sln --configuration Release --no-build --no-restore
